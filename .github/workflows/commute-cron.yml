name: Trigger Commute Radar Cron

on:
  schedule:
    # Runs every 15 mins between 6:30 AM - 10:30 AM & 4:30 PM - 9:00 PM IST (Mon-Fri)
    - cron: '0,15,30,45 1-5 * * 1-5'
    - cron: '0,15,30,45 11-15 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel Commute Engine
        run: |
          curl -X GET "https://${{ secrets.VERCEL_PROJECT_URL }}/api/cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
