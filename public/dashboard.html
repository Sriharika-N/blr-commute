<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Commute Scorecard — BLR Radar</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#070b09;color:#f9fafb;font-family:'Plus Jakarta Sans',sans-serif;padding:24px 16px;display:flex;justify-content:center}
.wrap{width:100%;max-width:440px}
.card{background:#0f1713;border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:22px;margin-bottom:14px}
.metric{font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:800;color:#10b981;margin:6px 0 2px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px}
.tag{display:inline-block;padding:4px 8px;background:rgba(16,185,129,0.12);color:#10b981;border-radius:6px;font-size:10px;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <span class="tag">VERIFIED COMMUTE SCORECARD</span>
    <div class="metric" id="total-saved">-- MINS</div>
    <div style="font-size:13px;color:#9ca3af" id="sub-hours">Reclaimed from Bangalore peak crawl this week</div>
  </div>

  <div class="card">
    <div style="font-size:12px;font-weight:800;color:#10b981;text-transform:uppercase;margin-bottom:8px">This Week's Activity</div>
    <div id="log-list"><div style="font-size:12px;color:#6b7280">Loading activity...</div></div>
  </div>
</div>

<script>
const SB_URL = 'https://rhljbzhpjhjsbknpiajn.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJobGpiemhwamhqc2JrbnBpYWpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2Mjk3ODMsImV4cCI6MjEwNTIwNTc4M30.V96TLm5sbWFSo-Hl4_xO0BbZC6-w2BKtbe4EmGU7CUc';

async function loadScorecard() {
  const urlParams = new URLSearchParams(window.location.search);
  const phone = urlParams.get('phone');
  if (!phone) return;

  const res = await fetch(`${SB_URL}/rest/v1/commute_feedback_log?phone=eq.${encodeURIComponent(phone)}&order=created_at.desc`, {
    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
  });
  const data = await res.json();
  if (!Array.isArray(data) || !data.length) {
    document.getElementById('total-saved').textContent = '0 MINS';
    document.getElementById('log-list').innerHTML = '<div style="font-size:12px;color:#6b7280">No verified commutes yet. Start by replying 1 to your alerts!</div>';
    return;
  }

  const total = data.reduce((sum, item) => sum + (item.minutes_saved || 0), 0);
  document.getElementById('total-saved').textContent = `${total}m`;
  document.getElementById('sub-hours').textContent = `~${(total/60).toFixed(1)} hours saved from ORR & Silk Board traffic`;

  document.getElementById('log-list').innerHTML = data.map(item => `
    <div class="row">
      <span>${item.day_of_week} Commute</span>
      <strong style="color:#10b981">+${item.minutes_saved}m saved</strong>
    </div>
  `).join('');
}
window.addEventListener('load', loadScorecard);
</script>
</body>
</html>
