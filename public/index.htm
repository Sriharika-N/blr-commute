<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLR Commute Radar — Pushover Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#090d0b;--card:#111915;--border:rgba(255,255,255,0.08);
  --accent:#10b981;--accent-glow:rgba(16,185,129,0.2);
  --txt:#f9fafb;--txt-muted:#9ca3af;
}
body{background:var(--bg);color:var(--txt);font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.container{width:100%;max-width:440px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 12px 36px rgba(0,0,0,0.5)}
.tag{display:inline-block;padding:4px 8px;background:rgba(16,185,129,0.1);color:var(--accent);border-radius:6px;font-size:10px;font-weight:700;letter-spacing:0.5px;margin-bottom:8px}
h1{font-size:20px;font-weight:800;margin-bottom:6px;letter-spacing:-0.4px}
p{font-size:13px;color:var(--txt-muted);line-height:1.5;margin-bottom:20px}
.field{margin-bottom:14px;position:relative}
label{display:block;font-size:11px;font-weight:600;color:var(--txt-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
input, select{width:100%;padding:12px 14px;background:#0d1310;border:1px solid var(--border);border-radius:8px;color:#fff;font-family:inherit;font-size:14px;outline:none;transition:border-color 0.2s}
input:focus, select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:14px;background:var(--accent);color:#022c1d;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;transition:transform 0.1s}
.btn:active{transform:scale(0.98)}
.acl{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#0d1310;border:1px solid var(--accent);border-radius:8px;max-height:180px;overflow-y:auto;z-index:100;display:none;box-shadow:0 8px 24px rgba(0,0,0,0.8)}
.aci{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border)}
.aci:hover{background:rgba(16,185,129,0.1)}
.success-card{display:none;text-align:center;padding:20px 0}
.icon-done{width:48px;height:48px;background:rgba(16,185,129,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--accent);font-size:20px}
</style>
</head>
<body>

<div class="container">
  <div class="card" id="form-card">
    <span class="tag">PUSHOVER RADAR</span>
    <h1>Outsmart Bangalore Traffic</h1>
    <p>We monitor your route and push alerts directly to your phone via Pushover with the exact minute to depart.</p>

    <!-- Origin -->
    <div class="field">
      <label>Home Location</label>
      <input id="fi" placeholder="Area, landmark, or street..." autocomplete="off" oninput="searchLoc('f')"/>
      <div class="acl" id="fac"></div>
    </div>

    <!-- Destination -->
    <div class="field">
      <label>Office Location</label>
      <input id="ti" placeholder="Tech park, office, or building..." autocomplete="off" oninput="searchLoc('t')"/>
      <div class="acl" id="tac"></div>
    </div>

    <!-- Times & Mode -->
    <div class="grid">
      <div class="field">
        <label>Target Arrival</label>
        <input type="time" id="arrive_time" value="09:30"/>
      </div>
      <div class="field">
        <label>Travel Mode</label>
        <select id="mode">
          <option value="car">Car / Cab</option>
          <option value="bike">Two-Wheeler</option>
        </select>
      </div>
    </div>

    <!-- Identifier & Pushover Key -->
    <div class="field">
      <label>Your Email (Identifier)</label>
      <input id="email" placeholder="name@company.com"/>
    </div>

    <div class="field">
      <label>Pushover User Key (<a href="https://pushover.net" target="_blank" style="color:var(--accent)">Find on Dashboard</a>)</label>
      <input id="pushover_key" placeholder="30-character User Key"/>
    </div>

    <button class="btn" onclick="saveCommuterProfile()">Activate Commute Radar</button>
  </div>

  <div class="card success-card" id="success-card">
    <div class="icon-done">✓</div>
    <h2>Radar Active</h2>
    <p style="margin-top:8px">Your routine is registered. Every weekday morning, you will receive a push notification on your phone before peak congestion hits.</p>
  </div>
</div>

<script>
const SB_URL = 'https://rhljbzhpjhjsbknpiajn.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJobGpiemhwamhqc2JrbnBpYWpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2Mjk3ODMsImV4cCI6MjEwNTIwNTc4M30.V96TLm5sbWFSo-Hl4_xO0BbZC6-w2BKtbe4EmGU7CUc';
const supabase = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null;

let fc = null, tc = null;
let timer = { f: null, t: null };

function searchLoc(type) {
  const val = document.getElementById(type === 'f' ? 'fi' : 'ti').value.trim();
  const list = document.getElementById(type === 'f' ? 'fac' : 'tac');
  if (val.length < 2) { list.style.display = 'none'; return; }

  clearTimeout(timer[type]);
  timer[type] = setTimeout(async () => {
    try {
      const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(val)}&lat=12.9716&lon=77.5946&limit=4`);
      const data = await res.json();
      const items = data.features || [];
      if (!items.length) { list.style.display = 'none'; return; }

      list.innerHTML = items.map(item => {
        const name = item.properties.name || item.properties.street || "Location";
        const sub = [item.properties.district, item.properties.city || 'Bengaluru'].filter(Boolean).join(', ');
        return `<div class="aci" onmousedown="pickLoc('${type}', ${item.geometry.coordinates[0]}, ${item.geometry.coordinates[1]}, '${name.replace(/'/g, "\\'")}')">
          <b>${name}</b><br><span style="font-size:10px;color:#9ca3af">${sub}</span>
        </div>`;
      }).join('');
      list.style.display = 'block';
    } catch {
      list.style.display = 'none';
    }
  }, 200);
}

function pickLoc(type, lng, lat, name) {
  document.getElementById(type === 'f' ? 'fi' : 'ti').value = name;
  document.getElementById(type === 'f' ? 'fac' : 'tac').style.display = 'none';
  if (type === 'f') fc = [lng, lat];
  else tc = [lng, lat];
}

async function saveCommuterProfile() {
  const userKey = document.getElementById('pushover_key').value.trim();
  const email = document.getElementById('email').value.trim();
  const arriveTime = document.getElementById('arrive_time').value;
  const mode = document.getElementById('mode').value;
  const fromName = document.getElementById('fi').value.trim();
  const toName = document.getElementById('ti').value.trim();

  if (!fc || !tc || !userKey || !email) {
    alert("Please select both locations from the list and provide your Email + Pushover User Key.");
    return;
  }

  const [h, m] = arriveTime.split(':').map(Number);
  const totalMins = h * 60 + m - 45;
  const leaveHomeTime = `${String(Math.floor(totalMins / 60)).padStart(2, '0')}:${String(totalMins % 60).padStart(2, '0')}`;

  const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
  const payloads = days.map(day => ({
    user_email: email,
    day_of_week: day,
    origin_name: fromName,
    origin_lat: fc[1], origin_lng: fc[0],
    dest_name: toName,
    dest_lat: tc[1], dest_lng: tc[0],
    leave_home_time: leaveHomeTime,
    leave_office_time: '18:30',
    pushover_user_key: userKey,
    vehicle_mode: mode,
    alerts_enabled: true
  }));

  const { error } = await supabase.from('commute_plans').insert(payloads);
  if (error) {
    alert("Database Error: " + error.message);
  } else {
    document.getElementById('form-card').style.display = 'none';
    document.getElementById('success-card').style.display = 'block';
  }
}
</script>
</body>
</html>
